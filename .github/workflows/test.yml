name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          dev-shell: ""
          command: |
            git clone --depth 1 https://github.com/nvim-lua/plenary.nvim.git ~/.config/nvim/pack/plenary/start/plenary.nvim
            nix shell github:NixOS/nixpkgs/b349185bb79c7cf7ad8ea8c097931730bf473c71#neovim --command \
              nvim --headless -c 'PlenaryBustedDirectory tests/plenary/ { init = "./tests/init.test.lua" }'

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          command: |
            luacheck .
            stylua --check .
            prettier --check .
